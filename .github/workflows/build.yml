name: Build & Push Roundcube image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Dockerfile']
  schedule:
    - cron: "0 6 * * 1"

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/surmod/docker-roundcube

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          no-cache: true
          tags: ${{ env.IMAGE }}:inspect

      - name: Extract version info
        id: meta
        run: |
          PHP_VERSION=$(docker run --rm ${{ env.IMAGE }}:inspect php -r 'echo PHP_VERSION;')
          echo "=== DEBUG: env vars ==="
          docker run --rm --entrypoint env ${{ env.IMAGE }}:inspect | sort | grep -i version || true
          echo "=== DEBUG: /usr/src/ ==="
          docker run --rm --entrypoint sh ${{ env.IMAGE }}:inspect -c 'ls /usr/src/ 2>/dev/null' || true
          echo "=== DEBUG: find iniset ==="
          docker run --rm --entrypoint sh ${{ env.IMAGE }}:inspect -c 'find / -name "iniset.php" 2>/dev/null | head -5' || true
          echo "=== DEBUG: iniset.php content ==="
          docker run --rm --entrypoint sh ${{ env.IMAGE }}:inspect -c 'grep -i version /usr/src/roundcubemail/program/include/iniset.php 2>/dev/null || echo "no version lines"' || true
          APP_VERSION=$(docker run --rm --entrypoint sh ${{ env.IMAGE }}:inspect -c 'cat /usr/src/roundcubemail/program/include/iniset.php 2>/dev/null | awk -F"'"'"'" "/RCUBE_VERSION/{print \$4}" || echo unknown')
          APP_VERSION=${APP_VERSION:-unknown}
          echo "php=${PHP_VERSION}" >> $GITHUB_OUTPUT
          echo "app=${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "Built: Roundcube ${APP_VERSION} / PHP ${PHP_VERSION}"

      - name: Tag and push
        run: |
          docker tag ${{ env.IMAGE }}:inspect ${{ env.IMAGE }}:latest
          docker tag ${{ env.IMAGE }}:inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.app }}
          docker tag ${{ env.IMAGE }}:inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.app }}-php${{ steps.meta.outputs.php }}
          docker push ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:${{ steps.meta.outputs.app }}
          docker push ${{ env.IMAGE }}:${{ steps.meta.outputs.app }}-php${{ steps.meta.outputs.php }}
