name: Build & Push Roundcube image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Dockerfile']
  schedule:
    - cron: "0 6 * * 1"

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/surmod/docker-roundcube

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          no-cache: true
          tags: ${{ env.IMAGE }}:inspect

      - name: Extract version info
        id: meta
        run: |
          PHP_VERSION=$(docker run --rm ${{ env.IMAGE }}:inspect php -r 'echo PHP_VERSION;')
          APP_VERSION=$(docker run --rm ${{ env.IMAGE }}:inspect php -r "include '/var/roundcube/htdocs/program/include/iniset.php'; echo RCUBE_VERSION;" 2>/dev/null || docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' ${{ env.IMAGE }}:inspect | grep -i 'VERSION=' | head -1 | cut -d= -f2)
          echo "php=${PHP_VERSION}" >> $GITHUB_OUTPUT
          echo "app=${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "Built: Roundcube ${APP_VERSION} / PHP ${PHP_VERSION}"

      - name: Tag and push
        run: |
          docker tag ${{ env.IMAGE }}:inspect ${{ env.IMAGE }}:latest
          docker tag ${{ env.IMAGE }}:inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.app }}
          docker tag ${{ env.IMAGE }}:inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.app }}-php${{ steps.meta.outputs.php }}
          docker push ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:${{ steps.meta.outputs.app }}
          docker push ${{ env.IMAGE }}:${{ steps.meta.outputs.app }}-php${{ steps.meta.outputs.php }}
